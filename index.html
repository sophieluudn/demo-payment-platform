<!doctype html>
<html lang="zh-Hant">
  <!-- ==================================================
         HEAD：頁面設定、轉址、樣式與腳本
         ================================================== -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 若直接開啟根路徑 "/"，自動導向登入頁 -->
    <script>
      if (location.pathname === "/") location.replace("login.html");
    </script>

    <title>首頁｜行動支付支援平台</title>

    <!-- 樣式：全站共用樣式（?v= 為快取版本參數）與元件樣式 -->
    <link rel="stylesheet" href="style.css?v=buttons-text-icon-4" />
    <link rel="stylesheet" href="ui/dist/element-app.css" />

    <!-- 腳本：元件庫（defer：待 HTML 解析完成後才執行） -->
    <script defer src="ui/dist/element-app.js"></script>
  </head>

  <body>
    <!-- ==================================================
             ASIDE：左側導覽選單
             ================================================== -->
    <aside>
      <!-- 首頁（目前頁面，以 active 標示） -->
      <a class="nav-main active" href="index.html">
        <img class="icon" src="assets/house.svg" alt="" />
        首頁
      </a>

      <!-- 選單群組：交易管理 -->
      <details>
        <summary>
          <img class="icon" src="assets/file-text.svg" alt="" />
          交易管理
          <img class="icon" src="assets/chevron-up.svg" alt="" />
        </summary>
        <div class="submenu">
          <a class="" href="transactions.html">所有交易紀錄</a>
        </div>
      </details>

      <!-- 選單群組：商品管理 -->
      <details>
        <summary>
          <img class="icon" src="assets/bag.svg" alt="" />
          商品管理
          <img class="icon" src="assets/chevron-up.svg" alt="" />
        </summary>
        <div class="submenu">
          <a class="" href="products.html">商品管理</a>
          <a class="" href="tags.html">標籤管理</a>
        </div>
      </details>

      <!-- 選單群組：統計報表 -->
      <details>
        <summary>
          <img class="icon" src="assets/briefcase.svg" alt="" />
          統計報表
          <img class="icon" src="assets/chevron-up.svg" alt="" />
        </summary>
        <div class="submenu">
          <a class="" href="statistics.html">商品交易統計</a>
          <a class="" href="statements.html">對帳單</a>
        </div>
      </details>

      <!-- 選單群組：系統管理 -->
      <details>
        <summary>
          <img class="icon" src="assets/gear.svg" alt="" />
          系統管理
          <img class="icon" src="assets/chevron-up.svg" alt="" />
        </summary>
        <div class="submenu">
          <a class="" href="users.html">使用者管理</a>
          <a class="" href="roles.html">角色管理</a>
          <a class="" href="projects.html">專案管理</a>
          <a class="" href="stores.html">商店管理</a>
          <a class="" href="payments.html">支付工具設定</a>
        </div>
      </details>
    </aside>

    <!-- ==================================================
             SHELL：右側主要區域（頂部列 + 內容）
             ================================================== -->
    <div class="shell">
      <!-- ---------- 頂部列 ---------- -->
      <header>
        <!-- 側邊選單收合按鈕（對應頁尾的 #collapse checkbox） -->
        <label for="collapse" class="menu-toggle" title="收合側邊選單">
          <img class="icon" src="assets/list.svg" alt="" />
        </label>

        <!-- 麵包屑導覽 -->
        <div class="breadcrumb">
          <a href="index.html">首頁</a>
        </div>

        <!-- 帳號資訊：版本、重置權限、時間、頭像 -->
        <div class="account">
          <a class="version" href="#">v1.4.2</a>
          <a class="reset" title="重新取得權限 token" href="index.html">重置</a>
          <span class="clock">12:56</span>
          <span class="avatar">S</span>
          <img class="icon" src="assets/chevron-down.svg" alt="" />
        </div>
      </header>

      <!-- ---------- 主要內容 ---------- -->
      <main>
        <!-- 歡迎訊息 -->
        <div class="welcome">
          歡迎進入
          <strong>行動支付支援平台</strong>
          後台管理系統
          <br />
          Demo
        </div>
      </main>
    </div>

    <!-- ==================================================
             側邊選單收合開關（隱藏的 checkbox）
             ※ 位置需維持在 body 最後，樣式可能依賴此相鄰順序，請勿任意移動
             ================================================== -->
    <input class="collapse-control" type="checkbox" id="collapse" />
  </body>
</html>
