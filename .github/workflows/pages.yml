name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Prepare static site including generated UI
        run: |
          mkdir -p _site/ui
          cp *.html *.css *.js _site/
          cp -R assets _site/assets
          cp -R ui/dist _site/ui/dist
          touch _site/.nojekyll
          test -s _site/ui/dist/element-app.js
          test -s _site/ui/dist/element-app.css
          test -s _site/ui/dist/access-app.js
          test -s _site/ui/dist/access-app.css
      - name: Version deployed assets to refresh browser caches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          for (const name of fs.readdirSync('_site').filter(name => name.endsWith('.html'))) {
            const file = path.join('_site', name);
            const html = fs.readFileSync(file, 'utf8').replace(/\b(src|href)="([^"?#]+\.(?:js|css))(?:\?[^"#]*)?"/g, (match, attr, asset) => {
              if (asset.startsWith('/') || /^[a-z]+:/i.test(asset)) return match;
              const content = fs.readFileSync(path.join('_site', asset));
              const version = crypto.createHash('sha256').update(content).digest('hex').slice(0, 12);
              return `${attr}="${asset}?v=${version}"`;
            });
            fs.writeFileSync(file, html);
          }
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
