name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Prepare static site including generated UI
        run: |
          mkdir -p _site/ui
          cp *.html *.css *.js _site/
          cp -R assets _site/assets
          cp -R ui/dist _site/ui/dist
          touch _site/.nojekyll
          test -s _site/ui/dist/element-app.js
          test -s _site/ui/dist/element-app.css
          test -s _site/ui/dist/access-app.js
          test -s _site/ui/dist/access-app.css
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
