<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>商品交易統計｜行動支付支援平台</title>
        <link rel="stylesheet" href="style.css?v=buttons-text-icon-4">
        <link rel="stylesheet" href="report-search.css?v=grid-1">
        <link rel="stylesheet" href="ui/dist/element-app.css">
        <script defer src="ui/dist/element-app.js"></script>
    </head>
    <body>
        <aside>
            <a class="nav-main " href="index.html">
                <img class="icon" src="assets/house.svg" alt="">首頁
            </a>
            <details open>
                <summary>
                    <img class="icon" src="assets/file-text.svg" alt="">交易管理
                    <img class="icon" src="assets/chevron-up.svg" alt="">
                </summary>
                <div class="submenu">
                    <a class="" href="transactions.html">所有交易紀錄</a>
                </div>
            </details>
            <details open>
                <summary>
                    <img class="icon" src="assets/bag.svg" alt="">商品管理
                    <img class="icon" src="assets/chevron-up.svg" alt="">
                </summary>
                <div class="submenu">
                    <a class="" href="products.html">商品管理</a>
                    <a class="" href="tags.html">標籤管理</a>
                </div>
            </details>
            <details open>
                <summary>
                    <img class="icon" src="assets/briefcase.svg" alt="">統計報表
                    <img class="icon" src="assets/chevron-up.svg" alt="">
                </summary>
                <div class="submenu">
                    <a class="active" href="statistics.html">商品交易統計</a>
                    <a class="" href="statements.html">對帳單</a>
                </div>
            </details>
            <details>
                <summary>
                    <img class="icon" src="assets/gear.svg" alt="">系統管理
                    <img class="icon" src="assets/chevron-up.svg" alt="">
                </summary>
                <div class="submenu">
                    <a class="" href="users.html">使用者管理</a>
                    <a class="" href="roles.html">角色管理</a>
                    <a class="" href="projects.html">專案管理</a>
                    <a class="" href="stores.html">商店管理</a>
                    <a class="" href="payments.html">支付工具設定</a>
                </div>
            </details>
        </aside>
        <div class="shell">
            <header>
                <label for="collapse" class="menu-toggle" title="收合側邊選單">
                    <img class="icon" src="assets/list.svg" alt="">
                </label>
                <div class="breadcrumb">
                    <a href="index.html">首頁</a>
                    <span>/</span>統計報表
                    <span>/</span>
                    <span>商品交易統計</span>
                </div>
                <div class="account">
                    <a class="version" href="#">v1.4.2</a>
                    <a class="reset" title="重新取得權限 token" href="statistics.html">重置</a>
                    <span class="clock">12:56</span>
                    <span class="avatar">S</span>
                    <img class="icon" src="assets/chevron-down.svg" alt="">
                </div>
            </header>
            <main>
                <form class="filter statistics-filter report-search-grid" method="get">
                    <label class="field">
                        <span>支付時間</span>
                        <input aria-label="2026-9-7　　 至　　 2026-10-7" placeholder="2026-9-7　　 至　　 2026-10-7" style="width:400px">
                    </label>
                    <div class="field report-format-field">
                        <span>報表形式</span>
                        <div class="report-format-options">
                            <label class="radio">
                                <input type="radio" name="report" checked>依商品統計
                            </label>
                            <label class="radio">
                                <input type="radio" name="report">依支付方式統計
                            </label>
                        </div>
                    </div>
                    <label class="field">
                        <span>* 專案名稱</span>
                        <select aria-label="全部　×　 + 2" style="width:400px">
                            <option>全部　×　 + 2</option>
                            <option>全部</option>
                            <option>行動發展部</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>* 商品名稱</span>
                        <select aria-label="全部　×　 + 83" style="width:400px">
                            <option>全部　×　 + 83</option>
                            <option>全部</option>
                            <option>行動發展部</option>
                        </select>
                    </label>
                    <div class="report-search-actions">
                        <button type="button" class="btn primary">搜尋</button>
                        <button type="reset" class="btn plain">清除</button>
                    </div>
                </form>
                <p class="notice">※ 以下金額皆為台幣且含稅</p>
                <div class="pager">共 0 項
                    <select aria-label="50項/頁" style="width:100px">
                        <option>50項/頁</option>
                        <option>全部</option>
                        <option>行動發展部</option>
                    </select>
                    <img class="icon" src="assets/chevron-left.svg" alt="">
                    <a class="active" href="#">1</a>
                    <img class="icon" src="assets/chevron-right.svg" alt="">
                </div>
                <div class="table-wrap ">
                    <table>
                        <thead>
                            <tr>
                                <th>專案名稱</th>
                                <th>商品名稱</th>
                                <th>價格</th>
                                <th>銷售數量</th>
                                <th>銷售總金額</th>
                                <th>手續費(小計)</th>
                                <th>退款數量</th>
                                <th>退款總金額</th>
                                <th>手續費退款(小計)</th>
                                <th>淨額(小計)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="empty" colspan="10">暫無資料</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="export">
                    <button type="button" class="btn plain">匯出 Excel</button>
                </div>
            </main>
        </div>
        <input class="collapse-control" type="checkbox" id="collapse">
        <script src="system-model.js"></script>
        <script src="data-access.js"></script>
        <script src="transaction-data.js"></script>
        <script src="statistics-data.js"></script>
    </body>
</html>
