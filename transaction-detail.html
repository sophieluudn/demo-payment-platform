        </div>
      </details>
      <details>
        <summary>
          <img class="icon" src="assets/briefcase.svg" alt="" />統計報表

        <div class="submenu">
          <a class="" href="statistics.html">商品交易統計</a>

      <details>

    <div class="shell">
      <header>
        <label for="collapse" class="menu-toggle" title="收合側邊選單">
          <img class="icon" src="assets/list.svg" alt="" />
        </label>
        <div class="breadcrumb">
          <a href="index.html">首頁</a>
          <span>/</span>交易管理
          <span>/</span>
          <span id="order-breadcrumb">訂單明細</span>
        </div>
        <div class="account">
          <a class="version" href="#">v1.4.2</a>
          <a
            class="reset"
            title="重新取得權限 token"
            href="transaction-detail.html?order=202609080050001"
            >重置</a
          >
          <span class="clock">12:56</span>
          <span class="avatar">S</span>
          <img class="icon" src="assets/chevron-down.svg" alt="" />
        </div>
      </header>
      <main class="order-detail">
        <div class="detail-toolbar">
          <a
            href="transactions.html"
            class="btn plain detail-back"
            aria-label="返回所有交易紀錄"
          >
            返回
          </a>
          <button class="btn refund-button" type="button" id="refund-button">
            退款
          </button>
        </div>
        <section class="detail-card product-summary">
          <dl id="product-summary"></dl>
          <div class="detail-tags">標籤</div>
        </section>
        <div class="detail-columns">
          <section class="detail-card">
            <dl id="payment-summary"></dl>
          </section>
          <section class="detail-card">
            <dl id="transaction-summary"></dl>
          </section>
        </div>
        <section class="detail-card order-history">
          <h2>訂單紀錄</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  <th>狀態</th>
                  <th>說明</th>
                </tr>
              </thead>
              <tbody id="order-history"></tbody>
            </table>
          </div>
        </section>
        <dialog id="refund-dialog">
          <h2>模擬退款</h2>
          <p>此為示範頁面，不會執行實際退款。</p>
          <form method="dialog">
            <button class="btn" autofocus>關閉</button>
          </form>
        </dialog>
      </main>

    <input class="collapse-control" type="checkbox" id="collapse" />
    <script src="system-model.js?v=fee-schedules-1"></script>
